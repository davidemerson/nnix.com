{% extends "index.html" %}

{% block content %}
<div><a href=".."><<<</a></div>
<h1 class="title">{{ taxonomy.name }}: {{ term.name }}</h1>
{% for page in term.pages %}
<header>
    <ul>
    <p><li>
        {{ page.taxonomies.authorname?[0] or "" }}.
        ({{ page.taxonomies.pubyear?[0] or "" }}).

    </li></p>
    </ul>
</header>
{% endfor %}
{% endblock content %}
