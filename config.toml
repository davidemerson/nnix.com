base_url = "https://nnix.com"
title = "nnix.com"
description = "novo nilbud by swamplight: coal’s short but we've got plenty of bog in the yard"
compile_sass = false
minify_html = true
skip_content_templating = ["projects/2024-09-static-website-github.md"]
generate_feeds = true
feed_filenames = ["rss.xml"]
default_language = "en"

taxonomies = [
	{ name = "recommender" },
	{ name = "authorname" },
	{ name = "pubyear" },
	{ name = "rating" },
	{ name = "readstate" },
	{ name = "foodcategory" }
]

[slugify]
paths = "on"
anchors = "on"

[markdown]
render_emoji = true
external_links_target_blank = true
smart_punctuation = true

[link_checker]
internal_level = "warn"

[extra]
author = "David Emerson"
epoch = "PLACEHOLDER"

# Food categories for cleaner template logic
[extra.food_categories]
bread-pastry = "bread & pastry"
desserts-snacks = "desserts & snacks"
dips-spreads = "dips & spreads"
drinks = "drinks"
main = "main dishes"